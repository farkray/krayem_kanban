# Uso: docker compose -f docker-compose.dev.yml up
services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
volumes:
  node_modules:
