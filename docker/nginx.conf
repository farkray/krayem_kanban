server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # OJO: add_header dentro de un location anula los del nivel superior, por eso
  # cada location incluye el snippet (lo genera docker/40-config.sh al arrancar).
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Nunca cachear: el navegador debe revalidar siempre (actualizaciones del service worker)
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  # Config runtime: nunca cacheada por HTTP (el SW la guarda aparte para abrir offline)
  location = /config.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  # El SW importa workbox-<hash>.js: el nombre cambia con el contenido, cache larga segura
  location ~ ^/workbox-[0-9a-f]+\.js$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Íconos de la app: cambian poco, pero sin hash
  location /icons/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Assets con hash: cache larga
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API de sincronización (contenedor `api`). El nombre se resuelve al vuelo (DNS de Docker) para que
  # nginx arranque aunque `api` no exista (p. ej. la imagen sola en modo local).
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://api:3000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 22m;
    # Tiempo real (SSE): nada de buffers y conexión larga.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Fallback SPA (rutas como /b/:id)
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
